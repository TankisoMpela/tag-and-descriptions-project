<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Wide Claim — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Wide Claim</h1>
      <p>A type-only poster with a red accent line and two oversized specimen words.</p>
    </div>
    <span class="source-id">T28576_07 · slot 41</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source Reference</figcaption>
      <img src="../../../support-references/T28576_07.jpg" alt="White type poster with two large specimen words, a two-line heading, and alternating red and black letters">
      <p class="reference-note">The browser version follows the original four-line rhythm, lets the uploaded face shape every line, and keeps the red and black word treatments independently adjustable.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live Composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable typographic poster"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Design Controls</h2>
      <label class="font-picker" for="font-file">Display Font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.WideClaim32);</script>
</body>
</html>
