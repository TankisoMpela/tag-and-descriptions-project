<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Focus Poster — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Focus Poster</h1>
      <p>A source-led editorial study with a framed eye, oversized word, and staggered quote.</p>
    </div>
    <span class="source-id">T28576_06 · slot 40</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source Reference</figcaption>
      <img src="../../../support-references/T28576_06.jpg" alt="Soft-focus portrait poster with a framed eye illustration, a large red headline, and five staggered quote columns">
      <p class="reference-note">The browser layout keeps the original eye crop, open poster spacing, red ink, and five-column copy rhythm. Editable wording uses Title Case without forcing uppercase.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live Composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable focus poster"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Design Controls</h2>
      <label class="font-picker" for="font-file">Display Font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.FocusPoster32);</script>
</body>
</html>
