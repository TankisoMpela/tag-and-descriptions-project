<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Stadium Poster — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Stadium poster</h1>
      <p>A red matchday broadside with towering, worn lettering over the original football plate.</p>
    </div>
    <span class="source-id">T21458_11 · slot 48</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T21458_11.jpg" alt="Cream stadium lettering over a red-tinted football photograph">
      <p class="reference-note">The player and ball stay in the original plate. Editable display lines inherit the source’s huge scale, stepped alignment, cream ink, and worn print surface.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable stadium poster artboard"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.StadiumPoster32);</script>
</body>
</html>
