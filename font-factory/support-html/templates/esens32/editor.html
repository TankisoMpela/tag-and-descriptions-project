<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch-c.css">
  <title>ESENS beauty portrait — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div><h1>ESENS beauty portrait</h1><p>Centered display lettering and a tracked skincare caption over a muted portrait.</p></div>
    <span class="source-id">T31141_05 · reference remake</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/user-batch-2026-10-26-c/T31141_05.jpg" alt="Original T31141_05 muted beauty portrait with pink ESENS title and skincare caption">
      <p class="reference-note">One centered vivid-pink display word spans the portrait, with a smaller widely tracked skincare caption below.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Editable ESENS beauty portrait"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a font to see how its real glyph widths fit this layout.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-c.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.UserReferenceBatchC.create("esens32"));</script>
</body>
</html>
