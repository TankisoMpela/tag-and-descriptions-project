<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Skin Badge — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Skin badge</h1>
      <p>Two overlapping skincare seals over a warm beauty portrait, with live center lettering and clipped repeat type.</p>
    </div>
    <span class="source-id">T24908_01 · slot 51</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T24908_01.jpg" alt="Lavender and brown circular skincare seals overlap over a close portrait crop">
      <p class="reference-note">The warm hair-and-skin photograph stays full bleed. The brown repeat seal sits behind the lavender hero seal, whose curved rim copy, center stack, stars, and painted underline remain independently editable.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable Skin Badge photo composition"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.SkinBadge32);</script>
</body>
</html>
