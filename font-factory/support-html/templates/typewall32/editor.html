<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Typewall — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Typewall</h1>
      <p>A full-bleed yellow type specimen with readable row spacing, an adjustable tilt, and controlled edge crops.</p>
    </div>
    <span class="source-id">T26223_02 · slot 62</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T26223_02.jpg" alt="Black rounded specimen words slanting across a saturated yellow page">
      <p class="reference-note">The oversized rounded words fill the yellow field in parallel diagonal rows. Keep the lettering heavy and close, while leaving enough room between words and rows for every phrase to read.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable repeating type specimen"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.Typewall32);</script>
</body>
</html>
