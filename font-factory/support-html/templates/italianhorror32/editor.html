<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch.css">
  <title>Italian Horror broadside — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div><h1>Italian Horror broadside</h1><p>Editable lettering fitted over the source composition with a measured safe area.</p></div>
    <span class="source-id">T15503_08 · reference remake</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/user-batch-2026-10-20/T15503_08.jpg" alt="Original T15503_08 font specimen reference">
      <p class="reference-note">The source artwork is preserved beside the editable remake. The text plate uses the cleaned background and keeps the source crop and hierarchy.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Editable Italian Horror broadside"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a font to see how its real glyph widths fit this layout.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.UserReferenceBatch.create("italianhorror32"));</script>
</body>
</html>
