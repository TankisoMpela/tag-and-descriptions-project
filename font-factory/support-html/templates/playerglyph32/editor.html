<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player display specimen</title>
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch-h.css">
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Player display specimen</h1>
      <p class="source-id">T21126_11 · reference remake</p>
    </div>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/reference-batch-2026-10-26-d/T21126_11.webp" alt="Pink display lettering and a large glyph panel on charcoal, with the words Player, your game, and manifestation">
      <p class="reference-note">The downloaded specimen is preserved unchanged. Its Yukas credit, Q glyph, three display lines, charcoal field, and source-pink blocks are rebuilt with live selected-font lettering and CSS.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Editable pink-lettered display specimen on charcoal"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a font to fit the Yukas credit, Q, and three live display lines.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-h.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.UserReferenceBatchH.create("playerglyph32"));</script>
</body>
</html>
