<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="../../shared/editor-shell.css">

<body>
  <header class="studio-header">
    <div>
      <h1>S/S Range fashion lettering specimen</h1>
      <p class="source-id">T32952_09 · reference remake</p>
    </div>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/reference-batch-2026-10-26-d/T32952_09.webp" alt="Yellow S/S Range and New Vogue fashion lettering over a model in a black sleeveless top">

    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Editable fashion lettering specimen over the supplied photograph"></div></div>

      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font

      </label>
      <div id="template-controls"></div>
    </aside>

  <script src="../../shared/layout.js"></script>
