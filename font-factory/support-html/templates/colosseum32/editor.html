<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Colosseum — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Colosseum</h1>
      <p>A three-colour type specimen on warm, softly grained paper.</p>
    </div>
    <span class="source-id">T26074_01 · slot 66</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T26074_01.jpg" alt="Warm paper specimen with centered navy colosseum, red gröngöling, navy antarctica, and a small red publisher footer">
      <p class="reference-note">The three centered words keep the source's roomy rhythm, original umlauts, navy/red/navy ink order, paper texture, and small publisher marks.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable Colosseum type specimen"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.Colosseum32);</script>
</body>
</html>
