<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Demolition type poster — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Demolition type poster</h1>
      <p>Four separate display rows over the original prismatic color field.</p>
    </div>
    <span class="source-id">T19827_06 · slot 46</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T19827_06.jpg" alt="Prismatic color-field poster with four charcoal display rows and a small twin-globe mark">
      <p class="reference-note">The original uses four evenly separated, left-aligned lines and a small archive caption with a twin-globe mark.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Four-row demolition type poster"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms. Missing characters stay visible in a system fallback.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.Demolition32);</script>
</body>
</html>
