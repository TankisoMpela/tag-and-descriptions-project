<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Rio At Dusk — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Rio At Dusk</h1>
      <p>A full-bleed travel hero with an oversized live-font destination title.</p>
    </div>
    <span class="source-id">T24250_04 · Slot 18</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source Reference</figcaption>
      <img src="../../../support-references/T24250_04.jpg" alt="Rio travel landing-page reference with a large destination title over Sugarloaf and Guanabara Bay">
      <p class="reference-note">The generated dusk panorama stays separate from the title, navigation, booking button, and closing copy. The uploaded display face drives the destination title.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live Composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable Rio travel landing-page hero"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Design Controls</h2>
      <label class="font-picker" for="font-file">Display Font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <label class="font-picker" for="label-font-file">Navigation Font
        <input id="label-font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="label-font-status" class="font-status">A compact label face is ready for the navigation and footer.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>
    window.SupportEditor.start(window.Rio32);
    const input = document.getElementById("label-font-file");
    const status = document.getElementById("label-font-status");
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      status.textContent = "Loading navigation font…";
      const face = new FontFace("UploadedRioLabel", 'url("' + URL.createObjectURL(file) + '")');
      try {
        await face.load();
        document.fonts.add(face);
        await document.fonts.ready;
        window.Rio32.labelFace = "UploadedRioLabel";
        window.configureTemplate();
        status.textContent = "loaded as the live label font: " + file.name;
      } catch (error) {
        status.textContent = "Could not load " + file.name + ": " + error.message;
      }
    });
  </script>
</body>
</html>
