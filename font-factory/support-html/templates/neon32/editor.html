<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Neon Marquee — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Neon Marquee</h1>
      <p>A theatre-door sign rebuilt from warm glass light, dark wall grain, and film-gate perforations.</p>
    </div>
    <span class="source-id">T30173_07 · slot 6</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T30173_07.jpg" alt="Warm script lettering for La Dolce Marea and Coming Soon glowing on a dark theatre door between vertical film perforations">
      <p class="reference-note">The script stays centered in two generously spaced lines. Incandescent cream strokes bloom softly against the brown-black door; seven cropped light windows mark each edge like a film gate.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable glowing theatre marquee composition"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local face to preview its actual script; missing letters remain visible with a warning.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.Neon32);</script>
</body>
</html>
