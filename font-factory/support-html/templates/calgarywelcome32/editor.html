<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calgary welcome lettering</title>
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch-m.css">
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Calgary welcome lettering</h1>
      <p class="source-id">T1391_03 · reference remake</p>
    </div>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/reference-batch-2026-10-29-a/T1391_03.jpg" alt="Large white Calgary lettering below mint Welcome to text on a dark distressed burgundy background">
      <p class="reference-note">The original is preserved unchanged. Its burgundy distressed field and mint-over-cream type hierarchy are rebuilt as separate layers; the location name and welcome line remain editable text.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Large Calgary title with a smaller mint Welcome to line"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a font to fit both live title lines.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-m.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.UserReferenceBatchM.create("calgarywelcome32"));</script>
</body>
</html>
