<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackgold bitmap specimen</title>
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch-m.css">
  <link rel="stylesheet" href="../../shared/user-reference-blackgold.css">
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Blackgold bitmap specimen</h1>
      <p class="source-id">T0002_00 · reference remake</p>
    </div>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/reference-batch-2026-10-29-a/T0002_00.jpg" alt="Black bitmap typeface specimen with teal and ivory BLACK GOLD lettering, white extrusion and small metadata">
      <p class="reference-note">The display words and metadata are editable browser text. Teal and ivory gradients and the hard white offset are CSS styling.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Live BLACK GOLD display lettering with gradient fill and hard offset extrusion"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a display font for BLACK and GOLD.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-m.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.UserReferenceBatchM.create("blackgold32"));</script>
</body>
</html>
