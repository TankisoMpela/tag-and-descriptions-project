<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/creative-market-batch-2026.css">
  <title>Your Love Is Weird — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div><h1>Your Love Is Weird</h1><p>A black-ink bunny cutout above editable display copy.</p></div>
    <span class="source-id">Creative Market reference batch · 2026-11-11</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Supplied reference</figcaption>
      <img src="../../../support-references/originals/creative-market-batch-2026-11-11/decoded/bootzy-clean-tm8-o.png" alt="Unchanged Creative Market reference" />
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Editable composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable font specimen layout"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Preview font</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose the product font to preview its letterforms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/creative-market-batch-2026.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.CmReferenceBatch.create('bootzybunny32'));</script>
</body>
</html>
