<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Gelato Cards — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Gelato cards</h1>
      <p>Two illustrated dessert cards, offset shadows, and a bright ice-cream shop photograph.</p>
    </div>
    <span class="source-id">T24908_03 · slot 53</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T24908_03.jpg" alt="Pink and cobalt gelato cards overlapping over an ice-cream photograph">
      <p class="reference-note">The pink card leads, with the blue card visible at its right and lower edges. Both print patterns stay clipped to their rounded panels; each heading, label, and footer is its own editable layer.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable gelato card composition"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <label class="font-picker" for="label-font-file">Card label font
        <input id="label-font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="label-font-status" class="font-status">The compact label face is ready for card captions.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>
    window.SupportEditor.start(window.GelatoCards32);
    const input = document.getElementById("label-font-file");
    const status = document.getElementById("label-font-status");
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      status.textContent = "Loading label font…";
      const face = new FontFace("UploadedGelatoLabel", 'url("' + URL.createObjectURL(file) + '")');
      try {
        await face.load();
        document.fonts.add(face);
        await document.fonts.ready;
        window.GelatoCards32.labelFace = "UploadedGelatoLabel";
        window.configureTemplate();
        status.textContent = "loaded as the live label font: " + file.name;
      } catch (error) {
        status.textContent = "Could not load " + file.name + ": " + error.message;
      }
    });
  </script>
</body>
</html>
