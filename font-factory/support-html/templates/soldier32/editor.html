<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Archival plate — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Archival plate</h1>
      <p>A clipped photograph, a large date, and the complete specimen set on a quiet black field.</p>
    </div>
    <span class="source-id">T13692_03 · slot 14</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T13692_03.jpg" alt="Archival specimen board with a clipped-corner group photograph, the year 1935, the headline This War Is Useless, full numerals, and currency symbols">
      <p class="reference-note">The thin frame and cross rules divide the photograph and year from the headline and glyph rows. The source's symbols include the cent, euro, and pound signs.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable archival type specimen"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Specimen font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms. Missing characters stay visible in a system fallback.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.Soldier32);</script>
</body>
</html>
