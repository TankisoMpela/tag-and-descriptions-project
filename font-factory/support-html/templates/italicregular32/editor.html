<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family style comparison specimen</title>
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch-c.css">
</head>
<body>
  <header class="editor-header">
    <div>
      <p class="eyebrow">Source-led support template</p>
      <h1>Family style comparison specimen</h1>
      <p class="source-id">T30392_12 · reference remake</p>
    </div>
  </header>
  <main class="editor-layout">
    <figure class="source-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/user-batch-2026-10-26-c/T30392_12.jpg" alt="Original T30392_12 two-style type specimen on lightly grained warm paper">
      <p class="reference-note">Two large letterforms sit below a centered, two-line italic-versus-regular label on warm, speckled paper.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Editable family style comparison specimen"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a font to see how its real glyph widths fit this layout.</span>
      </label>
      <label class="font-picker" for="family-font-file">Sibling family font
        <input id="family-font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="family-font-status" class="font-status">Choose another real style from the same family to compare it with the display font.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-c.js"></script>
  <script src="../../shared/editor-shell.js"></script>
    <script>
      window.SupportEditor.start(window.UserReferenceBatchC.create("italicregular32"));
      document.getElementById("family-font-file").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const status = document.getElementById("family-font-status");
        status.textContent = `Loading sibling style: ${file.name}`;
        const existing = [...document.fonts].find((face) => face.family === "SupportFamily1");
        if (existing) document.fonts.delete(existing);
        const familyFace = new FontFace("SupportFamily1", `url("${URL.createObjectURL(file)}")`);
        try {
          await familyFace.load();
          document.fonts.add(familyFace);
          window.SupportFamilyAvailable = ["SupportFamily1"];
          await document.fonts.ready;
          window.configureTemplate();
          status.textContent = `Loaded sibling family font: ${file.name}. Update the style label below if needed.`;
        } catch (error) {
          status.textContent = `Could not load ${file.name}: ${error.message}`;
        }
      });
    </script>
</body>
</html>
