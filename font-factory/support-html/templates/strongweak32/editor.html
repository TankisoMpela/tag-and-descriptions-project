<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Strongest and Weakest — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Strongest / Weakest</h1>
      <p>A cobalt specimen panel, irregular pink paper frame, offset ink, and comic callout stickers.</p>
    </div>
    <span class="source-id">T26289_00 · slot 55</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T26289_00.jpg" alt="Orange poster with a scalloped pink frame and cobalt panel reading strongest and weakest">
      <p class="reference-note">The rough frame, offset blue registration shadow, buttery lettering, and small sticker bursts give the specimen its playful printed feel. The two display words stay dominant and the footer completes the panel.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable strongest and weakest type poster"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <label class="font-picker" for="label-font-file">Sticker label font
        <input id="label-font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="label-font-status" class="font-status">A compact face is ready for the small sticker words.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>
    window.SupportEditor.start(window.StrongWeak32);
    const input = document.getElementById("label-font-file");
    const status = document.getElementById("label-font-status");
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      status.textContent = "Loading label font…";
      const face = new FontFace("UploadedStrongWeakLabel", 'url("' + URL.createObjectURL(file) + '")');
      try {
        await face.load();
        document.fonts.add(face);
        await document.fonts.ready;
        window.StrongWeak32.labelFace = "UploadedStrongWeakLabel";
        window.configureTemplate();
        status.textContent = "loaded as the live label font: " + file.name;
      } catch (error) {
        status.textContent = "Could not load " + file.name + ": " + error.message;
      }
    });
  </script>
</body>
</html>
