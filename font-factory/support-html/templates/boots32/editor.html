<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Wild Boots — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Wild Boots</h1>
      <p>Salt-flat portrait, overprinted horseshoes, and a complete engraved boot on sage stock.</p>
    </div>
    <span class="source-id">T24507_04 · slot 19</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T24507_04.jpg" alt="Sage western photography poster with a black-and-white salt-flat portrait, three coral horseshoes, Wild Boots lettering, and an engraved boot illustration">
      <p class="reference-note">The portrait's horizon starts the lower photo crop; its dark sky remains separate. The horseshoes print over the image edge, while the title stays clear in the open sage field.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable western photography poster"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Poster lettering
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms. Missing characters stay visible in a system fallback.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.Boots32);</script>
</body>
</html>
