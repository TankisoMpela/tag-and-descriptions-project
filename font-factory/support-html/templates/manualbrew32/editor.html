<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Manual Brew — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Manual Brew</h1>
      <p>A two-line, letter-by-letter color specimen on a quiet charcoal field.</p>
    </div>
    <span class="source-id">T26223_03 · slot 63</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T26223_03.jpg" alt="Multicolor rounded MANUAL BREW lettering and a small studio credit on charcoal">
      <p class="reference-note">The six-color top word, shorter four-color second line, large charcoal margins, and tiny centered studio credit are the whole composition.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable multicolor Manual Brew specimen"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <label class="font-picker" for="label-font-file">Credit font
        <input id="label-font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="label-font-status" class="font-status">A rounded local face is ready for the tiny studio credit.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>
    window.SupportEditor.start(window.ManualBrew32);
    const input = document.getElementById("label-font-file");
    const status = document.getElementById("label-font-status");
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      status.textContent = "Loading credit font…";
      const face = new FontFace("UploadedManualBrewLabel", 'url("' + URL.createObjectURL(file) + '")');
      try {
        await face.load();
        document.fonts.add(face);
        await document.fonts.ready;
        window.ManualBrew32.labelFace = "UploadedManualBrewLabel";
        window.configureTemplate();
        status.textContent = "loaded as the live label font: " + file.name;
      } catch (error) {
        status.textContent = "Could not load " + file.name + ": " + error.message;
      }
    });
  </script>
</body>
</html>
