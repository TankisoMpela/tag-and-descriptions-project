<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Storyteller — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Storyteller</h1>
      <p>An illustrated editorial spread with a four-line headline and working-hands detail.</p>
    </div>
    <span class="source-id">T28576_05 · slot 39</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T28576_05.jpg" alt="Editorial typography layout with a red-clad illustrator and a strip of working hands">
      <p class="reference-note">The source pairs a left editorial column and hands strip with a full-height framed artist portrait.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Storyteller editorial composition"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.Storyteller32);</script>
</body>
</html>
