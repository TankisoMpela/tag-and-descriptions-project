<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Year Poster — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Year poster</h1>
      <p>A full-bleed red-paper date poster with worn, oversized cream numerals.</p>
    </div>
    <span class="source-id">T21458_04 · slot 47</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T21458_04.jpg" alt="Distressed red-paper poster with oversized cream numerals reading 1982">
      <p class="reference-note">The original lets the year nearly fill the sheet; paper wear and ink wear remain visible as separate print layers.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Distressed year poster artboard"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms. Missing year digits stay visible in a readable fallback.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.YearPoster32);</script>
</body>
</html>
