<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Mad quote specimen</title>
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch-c.css">
</head>
<body>
  <header class="editor-header">
    <div>
      <h1>Little Mad quote specimen</h1>
      <p class="source-id">T33443_07 · reference remake</p>
    </div>
  </header>
  <main class="editor-layout">
    <figure class="source-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/user-batch-2026-10-26-c/T33443_07.jpg" alt="Original T33443_07 crimson italic quote with We All Go A Little Mad Sometimes, Psycho (1960) attribution, and white corner captions on a purple-to-black background">
      <p class="reference-note">Four crimson italic lines form the quote and Psycho attribution over a violet vignette; small white captions sit in all four corners.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Editable Little Mad quote specimen"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a font to see how its real glyph widths fit this layout.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-c.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.UserReferenceBatchC.create("littlemadquote32"));</script>
</body>
</html>
