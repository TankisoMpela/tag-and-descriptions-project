<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Numeral Folio — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div><h1>Numeral Folio</h1><p>A paper-toned numeral sheet with a font-derived type label.</p></div>
    <span class="source-id">Creative Market references · slot 181</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source Reference</figcaption>
      <img src="../../../support-references/originals/creative-market-2026-11-11/moren-15-o.png" alt="Cream numeral specimen sheet with ten large black figures, small centered labels, and a paper-like ground">
      <p class="reference-note">The live remake keeps the centered numeral grid and quiet paper tone, replacing the foundry name with a label derived from the selected font.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live Composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable numeral specimen sheet"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout Controls</h2>
      <label class="font-picker" for="font-file">Display Font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a font to see its numeral forms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.NumeralFolio32);</script>
</body>
</html>
