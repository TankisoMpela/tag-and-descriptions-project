<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Time Change — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div><h1>Time Change</h1><p>A pale-blue typographic poster with a dynamic font-style label.</p></div>
    <span class="source-id">Creative Market references · slot 182</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source Reference</figcaption>
      <img src="../../../support-references/originals/creative-market-2026-11-11/moren-10-o.png" alt="Pale blue serif lettering on black, arranged as Time, Change, and a large parenthesized numeral with small side labels">
      <p class="reference-note">The live remake preserves the dramatic centered scale, black ground, cool pale ink, and split side labels. Its type label follows the selected font instead of the source's fixed category.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live Composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable pale-blue type poster"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout Controls</h2>
      <label class="font-picker" for="font-file">Display Font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview the display words and figures.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.TimeChange32);</script>
</body>
</html>
