<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Greeting Grid — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Greeting grid</h1>
      <p>Six language greetings, each fitted to its own color block.</p>
    </div>
    <span class="source-id">T26074_06 · slot 69</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T26074_06.jpg" alt="Six greetings in an asymmetrical color-block grid">
      <p class="reference-note">The offset two-column rhythm, hot print colors, large Hallå and Bonjour panels, and small grain texture carry the source’s character.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Greeting grid artboard"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.GreetingsGrid32);</script>
</body>
</html>
