<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro television titles panel specimen</title>
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch-m.css">
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Retro television titles panel specimen</h1>
      <p class="source-id">T22722_07 · reference remake</p>
    </div>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/reference-batch-2026-10-29-a/T22722_07.jpg" alt="Three tilted yellow, pink, and teal paper panels with television title lettering and geometric confetti">
      <p class="reference-note">The original is preserved unchanged. Three separate tilted color bands, black offset paper edges, and geometric confetti are rebuilt as layers; all three show titles remain editable text.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Three television show titles on tilted yellow, pink, and teal panels"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a font to fit the three live title lines.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-m.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.UserReferenceBatchM.create("retroshowcase32"));</script>
</body>
</html>
