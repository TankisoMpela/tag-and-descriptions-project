<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Phone garden — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Phone garden</h1>
      <p>Three floral phone screens, each with its own source-proportioned type lockup.</p>
    </div>
    <span class="source-id">T30332_08 · slot 34</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T30332_08.jpg" alt="Three yellow-backed phone mockups with a split garden wordmark, vertical center lettering, flowers, stars, and a short garden message">
      <p class="reference-note">The three phone screens keep their separate layouts. The exact peony, screen color, source stars, and cream masks remain independent layers so the display type can change without flattening the artwork.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable three-phone garden composition"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <label class="font-picker" for="label-font-file">Small label font
        <input id="label-font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="label-font-status" class="font-status">A compact face is ready for the two side captions.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>
    window.SupportEditor.start(window.PhoneGarden32);
    const input = document.getElementById("label-font-file");
    const status = document.getElementById("label-font-status");
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      status.textContent = "Loading label font…";
      const face = new FontFace("UploadedPhoneGardenLabel", 'url("' + URL.createObjectURL(file) + '")');
      try {
        await face.load();
        document.fonts.add(face);
        await document.fonts.ready;
        window.PhoneGarden32.labelFace = "UploadedPhoneGardenLabel";
        window.configureTemplate();
        status.textContent = "loaded as the live label font: " + file.name;
      } catch (error) {
        status.textContent = "Could not load " + file.name + ": " + error.message;
      }
    });
  </script>
</body>
</html>
