<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="../../shared/editor-shell.css">

<body>
  <header class="studio-header">
    <div>
      <h1>The Scary Gangsta moon poster</h1>
      <p class="source-id">T16928_05 · reference remake</p>
    </div>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/reference-batch-2026-10-29-a/T16928_05.jpg" alt="Orange and rose Scary Gangsta title over a pale moon and dark violet forest, with The badge and a Thursday evening footer">

    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Scary Gangsta live lettering against a moonlit forest"></div></div>

      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font

        <span id="font-status" class="font-status">Choose a display font for the live title and badge.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-m.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.UserReferenceBatchM.create("scarygangsta32"));</script>
