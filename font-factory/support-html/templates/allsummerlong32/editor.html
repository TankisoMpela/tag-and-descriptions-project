<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Summer Long photo specimen</title>
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch-d.css">
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>All Summer Long photo specimen</h1>
      <p class="source-id">T35520_06 · reference remake</p>
    </div>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/reference-batch-2026-10-26-d/T35520_06.webp" alt="Triptych fashion photograph of a fully clothed woman outdoors, overlaid with large pink lettering">
      <p class="reference-note">The original reference is preserved unchanged. The live remake repeats the same clean central photo in three equal cards and repeats the same selected-font type design on each card; both side cards crop naturally at the canvas edges.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Three equal repeats of the same photo with repeated live All Summer Long lettering"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a font to see how its real glyph widths fit this layout.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-d.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.UserReferenceBatchD.create("allsummerlong32"));</script>
</body>
</html>
