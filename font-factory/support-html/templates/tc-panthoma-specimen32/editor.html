<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TC Panthoma red specimen poster</title>
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch-m.css">
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>TC Panthoma red specimen poster</h1>
      <p class="source-id">T29536_00 · reference remake</p>
    </div>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/reference-batch-2026-10-29-a/T29536_00.jpg" alt="Red TC Panthoma type specimen on a black field, with three large title lines and small labels along the top and bottom">
      <p class="reference-note">The original is preserved unchanged. The specimen title and all six edge labels remain independently editable.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Red live type specimen on black"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a display font for the type specimen.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-m.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.UserReferenceBatchM.create("tc-panthoma-specimen32"));</script>
</body>
</html>
