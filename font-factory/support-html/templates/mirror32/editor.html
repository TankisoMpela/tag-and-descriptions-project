<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Mirror Quote — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Mirror Quote</h1>
      <p>A six-line editorial statement crossing a mirrored black-and-white portrait.</p>
    </div>
    <span class="source-id">T13692_12 · slot 15</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T13692_12.jpg" alt="Black poster with a grayscale portrait and the six-line quote People hasten to judge in order not to be judged themselves">
      <p class="reference-note">The full-height mirror portrait sits left of the statement and continues beneath its first lines. Every line shares a right edge; the long first line begins over the portrait, setting the page’s tension.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable six-line mirror quotation poster"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local face to preview its actual letterforms. Unsupported quote characters remain visible with a warning.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.Mirror32);</script>
</body>
</html>
