<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/source-designs.css">
  <title>Stardust — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div><h1>Stardust</h1><p>The original monochrome portrait stays full-bleed beneath an editable three-line editorial headline and small checker mark.</p></div>
    <span class="source-id">T30332_01 · slot 28</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source Reference</figcaption>
      <img src="../../../support-references/T30332_01.jpg" alt="Stardust original source reference">
      <p class="reference-note">The reference artwork is shown beside a live HTML/CSS reconstruction. Display copy remains editable, and the original source wording is not baked into the new composition.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live Composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable Stardust design"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout Controls</h2>
      <label class="font-picker" for="font-file">Display Font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/source-layout.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.SourceLayoutDesign.build("stardust32"));</script>
</body>
</html>
