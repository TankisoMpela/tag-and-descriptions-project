<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Work And No Play</title>
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch-c.css">
</head>
<body>
  <header class="editor-header">
    <div>
      <h1>All Work And No Play</h1>
      <p class="source-id">T18053_05 · reference remake</p>
    </div>
  </header>
  <main class="editor-layout">
    <figure class="source-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/user-batch-2026-10-26-c/T18053_05.jpg" alt="Original T18053_05 with four fluorescent lime italic quote lines on a dark frozen blue texture">
      <p class="reference-note">The untouched original remains visible here; the live artboard uses a separate text-free ice texture plate and editable quote text.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Editable All Work And No Play quote poster"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a font to see how its real glyph widths fit this layout.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-c.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.UserReferenceBatchC.create("allworkplay32"));</script>
</body>
</html>
