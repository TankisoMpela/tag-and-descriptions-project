<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="./design.css">
  <title>Pixel quote — Support Layout Studio</title>
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Pixel quote</h1>
      <p>Five source-set lines with original pixel ornaments on a fixed hot-pink field.</p>
    </div>
    <span class="source-id">T30332_09 · slot 35</span>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Source reference</figcaption>
      <img src="../../../support-references/T30332_09.jpg" alt="Hot-pink five-line quote on black with a pixel heart, mascot, and stitch corners">
      <p class="reference-note">The heart, mascot, and stitch marks use the source's exact pixel crops. The fixed quote keeps its title case and stepped line widths; the selected font changes only its letterforms.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" aria-label="Editable hot-pink quote poster"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a local font to preview its actual letterforms.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="./design.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>window.SupportEditor.start(window.PixelQuote32);</script>
</body>
</html>
