<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Hard</title>
  <link rel="stylesheet" href="../../shared/editor-shell.css">
  <link rel="stylesheet" href="../../shared/user-reference-batch-j.css">
</head>
<body>
  <header class="studio-header">
    <div>
      <h1>Practice Hard</h1>
      <p class="source-id">T16168_07 · reference remake</p>
    </div>
  </header>
  <main class="studio-grid">
    <figure class="reference-panel">
      <figcaption class="panel-title">Original reference</figcaption>
      <img src="../../../support-references/originals/reference-batch-2026-10-26-d/T16168_07.webp" alt="White italic verbs paired with gold emphasis over a basketball on dark fabric">
      <p class="reference-note">The downloaded reference remains unchanged. Only its eight lettering words are removed from the separate photo plate; replacement copy stays editable in the selected font.</p>
    </figure>
    <section class="stage-panel" aria-label="Live template preview">
      <h2 class="panel-title">Live composition</h2>
      <div class="artboard-frame"><div id="artboard" data-ratio="3x2" aria-label="Editable four-row sports poster over a basketball photograph"></div></div>
    </section>
    <aside class="controls-panel">
      <h2 class="panel-title">Layout controls</h2>
      <label class="font-picker" for="font-file">Display font
        <input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="font-status" class="font-status">Choose a font to fit all four word pairs.</span>
      </label>
      <label class="font-picker" for="italic-family-font">Optional actual Italic family member
        <input id="italic-family-font" type="file" accept=".otf,.ttf,.woff,.woff2">
        <span id="italic-family-status" class="font-status">Use a real Italic sibling for the verbs; without one, they stay upright in the selected font.</span>
      </label>
      <div id="template-controls"></div>
    </aside>
  </main>
  <script src="../../shared/layout.js"></script>
  <script src="../../shared/user-reference-batch-j.js"></script>
  <script src="../../shared/editor-shell.js"></script>
  <script>
    window.SupportEditor.start(window.UserReferenceBatchJ.create("practicehard32"));
    window.UserReferenceBatchJ.bindItalicFamily(
      "italic-family-font", "italic-family-status", "the four white verbs use this family member",
    );
  </script>
</body>
</html>
