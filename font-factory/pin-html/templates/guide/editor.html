<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../shared/pin-studio.css">
  <link rel="stylesheet" href="design.css">
  <title>Guide — Pin Layout Studio</title>
</head>
<body data-template="guide">
  <header class="studio-header"><div><h1 id="studio-title">Guide</h1><p id="studio-copy">Adjust the copy, test your font, and review the composition at full pin scale.</p></div><span class="studio-mark">HTML/CSS · 2:3</span></header>
  <main class="studio-grid">
    <section class="stage-panel" aria-label="Live pin composition"><h2 class="panel-title">Live Composition</h2><div class="stage-frame"><div id="artboard" aria-label="Portrait pin preview"></div></div></section>
    <aside class="controls-panel"><h2 class="panel-title">Layout Iteration</h2><label class="font-picker" for="font-file">Try A Font<input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2"><span id="font-status">The specimen family is loaded by default; upload another font to compare.</span></label><div id="template-controls"></div><p class="iteration-note">Copy and font changes redraw the HTML/CSS composition immediately.</p></aside>
  </main>
  <script src="../../shared/pin-studio.js"></script>
</body>
</html>
