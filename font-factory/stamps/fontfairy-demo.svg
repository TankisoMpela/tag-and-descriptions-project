          font-size="76" font-style="italic" font-weight="700"
          letter-spacing="-3">PERSONAL USE ONLY!</text>

    <text x="48" y="405"
          font-family="DejaVu Serif, Liberation Serif, Noto Serif, serif"
          font-size="215" font-weight="700">Tmpela</text>

    <text x="55" y="487"
          font-family="DejaVu Sans, Liberation Sans, Noto Sans, sans-serif"
          font-size="55" font-style="italic" font-weight="700"
          letter-spacing="-1">For Commercial, Please Visit</text>

    <rect x="55" y="548" width="88" height="30"/>
    <text x="160" y="596"
          font-family="DejaVu Sans, Liberation Sans, Noto Sans, sans-serif"
          font-size="98" font-style="italic" font-weight="700"
          letter-spacing="-2">tmpela.store</text>

    <!-- bottom diagonal stripe band -->
    <polygon points="55,732 100,652 148,652 103,732"/>
    <polygon points="143,732 188,652 236,652 191,732"/>
    <polygon points="231,732 276,652 324,652 279,732"/>
    <polygon points="319,732 364,652 412,652 367,732"/>
    <polygon points="407,732 452,652 500,652 455,732"/>
    <polygon points="495,732 540,652 588,652 543,732"/>
    <polygon points="583,732 628,652 676,652 631,732"/>
