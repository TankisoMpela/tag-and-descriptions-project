<?xml version="1.0" encoding="UTF-8"?>
<!-- Tmpela free-trial-demo stamp: dark rectangular badge, diagonal stripe
     bands top/bottom, PERSONAL USE ONLY + store name + URL knockouts.
     Regenerate: python3 bin/stamp_personal_use.py outline
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="760" viewBox="0 0 1000 760">
  <rect x="0" y="0" width="1000" height="760" fill="#000000"/>
  <g fill="#ffffff">
    <!-- top diagonal stripe band -->
    <polygon points="55,108 100,28 148,28 103,108"/>
    <polygon points="143,108 188,28 236,28 191,108"/>
    <polygon points="231,108 276,28 324,28 279,108"/>
    <polygon points="319,108 364,28 412,28 367,108"/>
