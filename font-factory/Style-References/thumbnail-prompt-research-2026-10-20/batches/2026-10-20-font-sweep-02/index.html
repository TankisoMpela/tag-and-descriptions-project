<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Font Thumbnail Sweep 02</title>
  <style>
    :root { color-scheme: light; font: 16px/1.45 system-ui, sans-serif; background: #f1efe9; color: #24221f; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 2rem clamp(1rem, 4vw, 4rem) 1rem; max-width: 1500px; margin: auto; }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.8rem, 4vw, 3rem); letter-spacing: -.04em; }
    header p { margin: 0; color: #5e5a53; }
    main { max-width: 1500px; margin: auto; padding: 1rem clamp(1rem, 4vw, 4rem) 4rem; }
    .font { margin: 0 0 2.5rem; }
    .font h2 { margin: 0 0 .8rem; font-size: 1.25rem; }
    .pair { display: grid; grid-template-columns: minmax(0, 3fr) minmax(260px, 2fr); gap: 1rem; align-items: start; }
    figure { margin: 0; }
    a { display: block; color: inherit; }
    img { display: block; width: 100%; height: auto; background: #ddd; border: 1px solid #d1cec7; }
    figcaption { padding: .5rem .1rem; color: #6c675f; font-size: .85rem; }
    @media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Font Thumbnail Sweep 02</h1>
    <p>Ten new fonts · twenty individual renders · each font has a separately composed wide and square version.</p>
  </header>
  <main>
    <section class="font"><h2>Gligat</h2><div class="pair">
      <figure><a href="renders/3x2/gligat.png"><img src="renders/3x2/gligat.png" alt="Gligat, wide thumbnail"></a><figcaption>3:2 wide</figcaption></figure>
      <figure><a href="renders/1x1/gligat.png"><img src="renders/1x1/gligat.png" alt="Gligat, square thumbnail"></a><figcaption>1:1 square</figcaption></figure>
    </div></section>
    <section class="font"><h2>Lindgre</h2><div class="pair">
      <figure><a href="renders/3x2/lindgre.png"><img src="renders/3x2/lindgre.png" alt="Lindgre, wide thumbnail"></a><figcaption>3:2 wide</figcaption></figure>
      <figure><a href="renders/1x1/lindgre.png"><img src="renders/1x1/lindgre.png" alt="Lindgre, square thumbnail"></a><figcaption>1:1 square</figcaption></figure>
    </div></section>
    <section class="font"><h2>Groutpix F Torch</h2><div class="pair">
      <figure><a href="renders/3x2/groutpix-f-torch.png"><img src="renders/3x2/groutpix-f-torch.png" alt="Groutpix F Torch, wide thumbnail"></a><figcaption>3:2 wide</figcaption></figure>
      <figure><a href="renders/1x1/groutpix-f-torch.png"><img src="renders/1x1/groutpix-f-torch.png" alt="Groutpix F Torch, square thumbnail"></a><figcaption>1:1 square</figcaption></figure>
    </div></section>
    <section class="font"><h2>Semilya Fontera</h2><div class="pair">
      <figure><a href="renders/3x2/semilya-fontera.png"><img src="renders/3x2/semilya-fontera.png" alt="Semilya Fontera, wide thumbnail"></a><figcaption>3:2 wide</figcaption></figure>
      <figure><a href="renders/1x1/semilya-fontera.png"><img src="renders/1x1/semilya-fontera.png" alt="Semilya Fontera, square thumbnail"></a><figcaption>1:1 square</figcaption></figure>
    </div></section>
    <section class="font"><h2>Dianda Extrude</h2><div class="pair">
      <figure><a href="renders/3x2/dianda-extrude.png"><img src="renders/3x2/dianda-extrude.png" alt="Dianda Extrude, wide thumbnail"></a><figcaption>3:2 wide</figcaption></figure>
      <figure><a href="renders/1x1/dianda-extrude.png"><img src="renders/1x1/dianda-extrude.png" alt="Dianda Extrude, square thumbnail"></a><figcaption>1:1 square</figcaption></figure>
    </div></section>
    <section class="font"><h2>Ageless Heritage</h2><div class="pair">
      <figure><a href="renders/3x2/ageless-heritage.png"><img src="renders/3x2/ageless-heritage.png" alt="Ageless Heritage, wide thumbnail"></a><figcaption>3:2 wide</figcaption></figure>
      <figure><a href="renders/1x1/ageless-heritage.png"><img src="renders/1x1/ageless-heritage.png" alt="Ageless Heritage, square thumbnail"></a><figcaption>1:1 square</figcaption></figure>
    </div></section>
    <section class="font"><h2>Jina Glow</h2><div class="pair">
      <figure><a href="renders/3x2/jina-glow.png"><img src="renders/3x2/jina-glow.png" alt="Jina Glow, wide thumbnail"></a><figcaption>3:2 wide</figcaption></figure>
      <figure><a href="renders/1x1/jina-glow.png"><img src="renders/1x1/jina-glow.png" alt="Jina Glow, square thumbnail"></a><figcaption>1:1 square</figcaption></figure>
    </div></section>
    <section class="font"><h2>Marigold Eighties</h2><div class="pair">
      <figure><a href="renders/3x2/marigold-eighties.png"><img src="renders/3x2/marigold-eighties.png" alt="Marigold Eighties, wide thumbnail"></a><figcaption>3:2 wide</figcaption></figure>
      <figure><a href="renders/1x1/marigold-eighties.png"><img src="renders/1x1/marigold-eighties.png" alt="Marigold Eighties, square thumbnail"></a><figcaption>1:1 square</figcaption></figure>
    </div></section>
    <section class="font"><h2>Ovaline</h2><div class="pair">
      <figure><a href="renders/3x2/ovaline.png"><img src="renders/3x2/ovaline.png" alt="Ovaline, wide thumbnail"></a><figcaption>3:2 wide</figcaption></figure>
      <figure><a href="renders/1x1/ovaline.png"><img src="renders/1x1/ovaline.png" alt="Ovaline, square thumbnail"></a><figcaption>1:1 square</figcaption></figure>
    </div></section>
    <section class="font"><h2>The Pavefloz</h2><div class="pair">
      <figure><a href="renders/3x2/the-pavefloz.png"><img src="renders/3x2/the-pavefloz.png" alt="The Pavefloz, wide thumbnail"></a><figcaption>3:2 wide</figcaption></figure>
      <figure><a href="renders/1x1/the-pavefloz.png"><img src="renders/1x1/the-pavefloz.png" alt="The Pavefloz, square thumbnail"></a><figcaption>1:1 square</figcaption></figure>
    </div></section>
  </main>
</body>
</html>
