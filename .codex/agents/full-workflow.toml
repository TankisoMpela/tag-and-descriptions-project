1. `font_image_generator`
2. `font_preparer`
3. `cm_fonts_specialist`
4. `creative_fabrica_fonts_specialist`
5. `font_final_visual_processor` when its readiness gate passes.

Delegate one child at a time and wait for its final response. Verify the
