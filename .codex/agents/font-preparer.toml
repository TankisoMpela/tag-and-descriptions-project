archive names, metadata, technical audit, the two factual specimen sheets
(Step 2b), checked installation of all 23 Agent-27 Pinterest pins (Step 2),
and the `visuals/New-Images/` handoff. Follow it exactly. Do not rely on older visual derivative, video, or
