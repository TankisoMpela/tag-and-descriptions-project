name = "font_final_visual_processor"
description = "Agent 30 final full-workflow image processor. Uses Agent-27 generated thumbnails and prepared support images to write delivery JPEGs, ten edge-to-edge PNG Pinterest composites, and a manifest."
model = "gpt-5.6-luna"
